<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
                *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: 'Poppins',sans-serif;
        }


        .s1{
            height: 100vh;
            width : 50%;
            background-color: brown;
            
        }
        .bar-background {
            height: 40px;
            width : 70%;
            background-color:blanchedalmond;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;

        }
        .bar-border{
            width : 70%;
            height: 10%;
            background-color: aqua;
        
        }
        .bar-progress{
            width: 50%;
            height:100%;
            background-color: brown;
            

        }
        .icons{
            border-radius: 50%;
            background-color: brown;
            height:30px;
            width: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        i{
            color: white;
        }
        .container_ext{
            width: 80%;
            height: 100px;
            background-color: black;
            display: flex;
            flex-direction: column;

        }
        h3, h5{
            color: white;
        }
        .container-border{
            width: 80%;
            height:20px;
            background-color: inherit;
            display: flex;
            flex-direction: row;
            gap: 10px;

        }
        .container-border2{
            width: 80%;
            height:15px;
            background-color: white;


        }
        .container-progress{
            background-color: yellow;
            height: 100%;
        }




    </style>
</head>
<body>

    <section class = "s1">

        <div class="container_ext">
            <h3>French</h3>
            <div class = "container-border">
                <div class="container-border2">
                    <div class="container-progress" style = "width :80%"></div>
                </div>
                <h5> 80%</h5>

            </div>

        </div>

        

    </section>



    
</body>
</html>
