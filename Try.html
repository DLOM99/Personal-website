<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FullPage Scroll</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullpage.js/dist/fullpage.min.css">
  <style>
    section {
      text-align: center;
      font-size: 2rem;
      display: flex;
      /**justify-content: center;
      align-items: center; **/
      height: 100vh;
    }
    .section1 { background-color: #4caf50; }
    .section2 { background-color: #2196f3; }
    .section3 { background-color: #ff5722; }
    .bar-background {
      width : 100%;
      height : 100px;
      background-color: #ff5722;
      margin:0;
      
    }
    .bar-border{
      margin: 30px;
      width : 30%;
      height : 30px;
      background-color: white;
    }
  </style>
</head>
<body>
  <div id="fullpage">
    <section class="section section1">Welcome to Page 1

      <div class="bar-background">
        <div class="bar-border"> 
          <div class="bar-level">
            
          </div>
        </div>
      </div>
    </section>

    <section class="section section2">This is Page 2</section>
    <section class="section section3">And this is Page 3</section>
  </div>



  <script src="https://cdn.jsdelivr.net/npm/fullpage.js/dist/fullpage.min.js"></script>
  <script>
    new fullpage('#fullpage', {
      navigation: true,
      sectionsColor: ['#4caf50', '#2196f3', '#ff5722'],
    });
  </script>
</body>
</html>
