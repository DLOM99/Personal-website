<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;500;700&family=Lato:wght@400;500;700&family=Poppins:wght@400;500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&family=Poppins:wght@700&family=Quicksand:wght@700&family=Rubik:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: 'Poppins',sans-serif;
        }
        body {
            position: relative;
            margin: 0 100px;
            height: 100vh;
            background-color: #000;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% + 200px);
            height: 100%;
            background-image: url('Picture/ales-nesetril-Im7lZjxeLhg-unsplash.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            filter: blur(20px);
            z-index: -1;
            margin-left: -100px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity:1;
            padding: 10px;
            width: 80%;
            margin-top: 10px;
            margin-left: 5px;
            z-index:2;
        }

        nav {
            display: flex;
            list-style-type: none;
            padding: 0;
            gap:35px;
            font-family: 'Poppins','Open Sans','Roboto', 'Lato', 'Poppins', 'Inter', sans-serif;
        }
        nav li {
            font-size: 15px;
            font-family: 'Montserrat', sans-serif;
            font-weight: lighter;
        }
        nav li a {
            color: white;
            text-decoration: none;
        }
        nav li a:hover {
            color:#E0BB20;
            transition: 0.3s ease-out;
        }
        h3{
            color: white;
            font-weight: 700;
            font-family: sans-serif;
        }
        h4{
            margin-top: 10px;
            text-align: center;
            color:white;
        }
        h5{
            color:white;
        }

        .a{
            color: white;
            text-align: center;
            position: relative;
            top: 50px;
            font-weight: 700;
            font-size: 30px;
        }

        .subject{
            display:flex;
            justify-content: center;
            align-items: center;
            background-color: red;
            height:50px;
        }
        .container{
           height: auto;
            width: 40%;
            background-color:inherit;
            display: flex;
            flex-direction: column;
        }
        section{
            min-height: 100vh;
            height: auto;
            width: 80%;
            display: flex;
            gap: 10px;
            margin: 0 10%;
            margin-top: 5%;
            overflow: visible;
            justify-content: center;
        }
        .bar-background {
            height: 60px;
            width : 95%;
            background-color:inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-left: 10px;
            margin-top:10px;
        }
        .bar-border{
            width : 70%;
            height: 10%;
            background-color: aqua;
            border-radius:40px;
        }
        .bar-progress{
            width: 50%;
            height:100%;
            background-color: brown;
            border-radius:40px;
        }
        .two{
            width: 70%;
            height:100%;
            background-color: brown;
        }
        .icons{
            border-radius: 50%;
            background-color: brown;
            height:30px;
            width: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        i{
            color: white;
        }

        .container-border{
            width: 80%;
            height:20px;
            background-color: inherit;
            display: flex;
            flex-direction: row;
            gap: 10px;
        }
        .container-border2{
            width: 80%;
            height:15px;
            background-color: white;
        }
        .container-progress{
            background-color: yellow;
            height: 100%;
        }
        .active{
            color: #E0BB20;
        }

        /* Added Ease-in animation for falling from above */
        .ease-in {
            opacity: 0;
            transform: translateY(-50px);
            animation: easeIn 1s ease-in-out forwards;
        }

        @keyframes easeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

</head>
<body>
    <header>
        <h3>Daniel</h3>
        <nav>
            <li><a href="/index.html" >Home</a></li>
            <li><a href="/About.html">About</a></li>
            <li><a href="/Skills.html" class = "active">Skills</a></li>
            <li><a  href="/Projects.html"> Projects</a></li>
            <li><a href="/contact.html">Contact</a></li>

    <p class="a ease-in"> Skills</p>

            <div class="bar-background ease-in">

            <div class="bar-background ease-in">

            <div class="bar-background ease-in">

            <h4 class = "ease-in"> Language </h4>

            </div>
            <div class="bar-background ease-in">
                <div class="icons1">

            <div class="bar-background ease-in">

            </div>
        </div>
    </section>
    <script>
        document.querySelectorAll('body > *:not(header) .ease-in').forEach((el, index) => {
            el.style.animationDelay = `${index * 0.2}s`;
        });
    </script>
</body>
</html>
